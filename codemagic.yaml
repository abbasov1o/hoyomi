# Codemagic CI — secret gerektirmeyen, imzasız (unsigned) iOS IPA.
# Cihaz (iphoneos / arm64) için derler; jailbreak'li cihaza TrollStore/appinst ile kurulur.
# Kurulum: codemagic.io → GitHub ile gir → bu repoyu ekle →
#          konfigürasyon kaynağı = codemagic.yaml → workflow "ios-unsigned" → Start build.
workflows:
  ios-unsigned:
    name: iOS Unsigned IPA (device, no secrets)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Swift Package Manager'i kapat (eklentiler SPM desteklemiyor)
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Bos env dosyalari (.env zorunlu degil)
        script: |
          : > .env
          : > .env.web

      - name: Rust + iOS target kur
        script: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios

      - name: flutter pub get
        script: flutter pub get

      - name: build_runner (codegen - env.g.dart vb. uretir)
        script: dart run build_runner build --delete-conflicting-outputs

      - name: CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS (device)
        script: |
          flutter build ios --release --no-codesign

      - name: Package -> .deb (rootless jailbreak) + unsigned .ipa
        script: |
          APP=build/ios/iphoneos/Runner.app
          # --- unsigned .ipa (TrollStore/appinst icin) ---
          rm -rf build/ios/iphoneos/Payload
          mkdir -p build/ios/iphoneos/Payload
          cp -r "$APP" build/ios/iphoneos/Payload/
          (cd build/ios/iphoneos && zip -qq -r -9 app-iphoneos-release-unsigned.ipa Payload)
          # --- rootless .deb (Dopamine / palera1n-rootless: /var/jb, iphoneos-arm64) ---
          # ROOTFUL isen: 'var/jb/Applications' -> 'Applications' ve Architecture -> iphoneos-arm yap.
          ROOT=debroot
          rm -rf "$ROOT"
          mkdir -p "$ROOT/var/jb/Applications" "$ROOT/DEBIAN"
          cp -r "$APP" "$ROOT/var/jb/Applications/Hoyomi.app"
          printf 'Package: git.shin.hoyomi\nName: Hoyomi\nVersion: 1.0.0\nArchitecture: iphoneos-arm64\nDescription: Hoyomi - OpenAnime\nMaintainer: hoyomi\nAuthor: hoyomi\nSection: Applications\n' > "$ROOT/DEBIAN/control"
          printf '#!/bin/sh\nuicache -p /var/jb/Applications/Hoyomi.app || uicache -a\nexit 0\n' > "$ROOT/DEBIAN/postinst"
          chmod 0755 "$ROOT/DEBIAN/postinst"
          brew list dpkg >/dev/null 2>&1 || brew install dpkg
          dpkg-deb -Zgzip -b "$ROOT" hoyomi-rootless.deb
    artifacts:
      - build/ios/iphoneos/*.ipa
      - hoyomi-rootless.deb
