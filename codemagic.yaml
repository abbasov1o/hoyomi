# Codemagic CI — şifrə tələb etməyən, imzasız (unsigned) iOS IPA istehsal edir.
workflows:
  ios-unsigned:
    name: iOS Unsigned IPA (no secrets)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Boş env faylları yarat
        script: |
          : > .env
          : > .env.web
      - name: Flutter pub get
        script: flutter pub get
      - name: Pod repo update
        script: cd ios && pod repo update
      - name: Build runner (codegen)
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Build & package unsigned IPA
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 app-iphoneos-release-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa
